# Build and publish a signed APK whenever a version tag (e.g. v1.0.0) is pushed.
#
# Signing is optional: configure these repository secrets to publish a signed
# release automatically. Without them the job still builds the APK and uploads
# it as a workflow artifact, but does not touch the GitHub Release.
#
#   SONORA_KEYSTORE_BASE64  base64 of your .jks keystore  (base64 -w0 sonora-release.jks)
#   SONORA_STORE_PASSWORD   keystore password
#   SONORA_KEY_ALIAS        key alias (e.g. sonora)
#   SONORA_KEY_PASSWORD     key password
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build release APK
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.SONORA_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.SONORA_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/sonora-release.jks"
          echo "SONORA_KEYSTORE=$RUNNER_TEMP/sonora-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          SONORA_STORE_PASSWORD: ${{ secrets.SONORA_STORE_PASSWORD }}
          SONORA_KEY_ALIAS: ${{ secrets.SONORA_KEY_ALIAS }}
          SONORA_KEY_PASSWORD: ${{ secrets.SONORA_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Build unsigned release APK (no signing secrets configured)
        if: env.HAS_KEYSTORE != 'true'
        run: ./gradlew --no-daemon assembleRelease

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"

      - name: Generate checksum
        run: |
          cd "$(dirname "${{ steps.apk.outputs.path }}")"
          sha256sum "$(basename "${{ steps.apk.outputs.path }}")" > "${{ steps.apk.outputs.name }}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonora-release
          path: |
            ${{ steps.apk.outputs.path }}
            app/build/outputs/apk/release/*.sha256
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: env.HAS_KEYSTORE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.apk.outputs.path }}
            app/build/outputs/apk/release/*.sha256
          generate_release_notes: true
