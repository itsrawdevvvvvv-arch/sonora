<!DOCTYPE html>
<html lang="en">
<head>
<script>
/* Sonora — Android native bridge shim.
   In a browser window.SonoraBridge is undefined and the app runs on a small
   demo library so the interface is fully explorable. On Android it routes
   library scanning and playback to the native layer. */
(function () {
  if (window.SonoraBridge) {
    document.documentElement.setAttribute('data-android', '1');
  }
})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>Sonora</title>
<style>
:root{
  --sat:0px; --sab:0px;
  --orange:#F3A264;
  --orange-2:#EC9550;
  --orange-soft:#FFCB9E;
  --on-orange:#231409;
  --ink:#121212;
  --surface:#1E1E1E;
  --surface-2:#2A2A2A;
  --line:rgba(255,255,255,.09);
  --text:#FFFFFF;
  --muted:#9A9A9E;
  --muted-2:#6E6E73;
  --radius:22px;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:#0d0d0d;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--text);
  overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit}

/* ---- device frame (desktop preview only) ---- */
.app{
  position:relative;
  width:100%;max-width:460px;
  height:100dvh;
  margin:0 auto;
  background:var(--ink);
  overflow:hidden;
  display:flex;flex-direction:column;
}
@media(min-width:520px){
  body{background:#FFB787;display:grid;place-items:center}
  .app{height:min(900px,94vh);border-radius:46px;box-shadow:0 30px 90px rgba(60,25,0,.45);border:1px solid rgba(0,0,0,.18)}
}

/* ---- status bar ---- */
.statusbar{
  height:46px;display:flex;align-items:center;justify-content:space-between;
  padding:0 26px 0 30px;font-size:15px;font-weight:600;letter-spacing:.2px;
  color:var(--on-orange);
}
.statusbar .sb-right{display:flex;align-items:center;gap:6px}
html[data-android] .statusbar{display:none}
html[data-android] .hero{padding-top:calc(var(--sat) + 6px)}

/* ---- screens ---- */
.screens{position:relative;flex:1;overflow:hidden}
.screen{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  opacity:0;visibility:hidden;
  transform:translateY(10px);
  transition:opacity .28s var(--ease),transform .34s var(--ease),visibility .34s;
  will-change:opacity,transform;
}
.screen.active{opacity:1;visibility:visible;transform:none}

.hero{
  background:linear-gradient(178deg,var(--orange) 0%,var(--orange-2) 100%);
  border-radius:0 0 30px 30px;
  padding:0 16px 20px;
  position:relative;
  flex:none;
}
.hero h1{margin:0;font-size:30px;font-weight:700;color:var(--on-orange);letter-spacing:-.5px}
.hero .sub{color:rgba(35,20,9,.72)}

.body{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 16px 120px;-webkit-overflow-scrolling:touch}
.body::-webkit-scrollbar{display:none}

/* ---- home tiles ---- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.tile{
  position:relative;height:132px;border-radius:var(--radius);
  background:#1c1c1e;overflow:hidden;
  display:flex;align-items:flex-end;
  padding:14px;
  transition:transform .18s var(--ease);
  contain:paint;
}
.tile:active{transform:scale(.965)}
.tile .glow{position:absolute;inset:0;opacity:.9}
.tile .glyph{position:absolute;right:-4px;top:-8px;width:82px;height:82px;opacity:.30}
.wave{display:inline-flex;vertical-align:-3px}
.tile .tl-label{position:relative;font-weight:600;font-size:17px;color:#fff}
.tile .badge{
  position:relative;margin-left:8px;font-size:11px;font-weight:700;
  background:var(--orange-soft);color:#3a2410;border-radius:20px;padding:3px 9px;
}
.tile .tl-row{position:relative;display:flex;align-items:center}

/* ---- search ---- */
.searchbar{
  display:flex;align-items:center;gap:10px;margin-top:16px;
  background:var(--surface);border:1px solid var(--line);
  border-radius:30px;padding:8px 8px 8px 16px;
}
.searchbar .mag{flex:none;color:var(--muted);display:flex}
.searchbar input{
  flex:1;min-width:0;background:none;border:0;outline:none;color:#fff;
  font-size:16px;padding:8px 0;
}
.searchbar input::placeholder{color:var(--muted)}
.chip-white{
  flex:none;display:flex;align-items:center;gap:6px;
  background:#fff;color:#111;font-weight:600;font-size:14px;
  border-radius:22px;padding:9px 14px;
  transition:transform .16s var(--ease);
}
.chip-white:active{transform:scale(.95)}

/* ---- list rows ---- */
.list{margin-top:6px}
.row{
  display:flex;align-items:center;gap:13px;
  padding:12px 0;border-bottom:1px solid var(--line);
  transition:transform .16s var(--ease);
  contain:layout paint;
}
.row:active{transform:scale(.985)}
.row .thumb{
  flex:none;width:48px;height:48px;border-radius:14px;overflow:hidden;
  display:grid;place-items:center;position:relative;
}
.row .thumb svg{width:22px;height:22px;opacity:.9;color:#fff}
.row .meta{flex:1;min-width:0}
.row .t{font-size:16px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .act{
  flex:none;width:40px;height:40px;border-radius:50%;
  background:var(--surface-2);display:grid;place-items:center;color:#fff;
  transition:transform .16s var(--ease),background .16s;
}
.row .act:active{transform:scale(.9)}
.row.playing .t{color:var(--orange-soft)}

/* library rows: bigger thumb + chevron */
.lrow{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--line);transition:transform .16s var(--ease);contain:layout paint}
.lrow:active{transform:scale(.985)}
.lrow .thumb{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center}
.lrow .thumb svg{width:24px;height:24px;opacity:.9}
.lrow .meta{flex:1;min-width:0}
.lrow .t{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .s{font-size:13px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .chev{flex:none;width:40px;height:40px;border-radius:13px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}

.np-like{flex:none;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;color:var(--muted);transition:transform .16s var(--ease),color .2s}
.np-like:active{transform:scale(.9)}
.np-like.on{color:var(--orange)}
.grouphead{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:18px 0 6px}

/* ---- library featured card ---- */
.sect{color:var(--on-orange);font-weight:700;font-size:15px;margin:16px 0 10px}
.hero .sect{color:rgba(35,20,9,.85)}
.hero-lib{padding-bottom:0}
.feature{
  position:relative;height:150px;border-radius:24px 24px 0 0;overflow:hidden;
  background:#1c1c1e;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;
  margin:0;padding-left:22px;padding-right:22px;
}
.feature .glow{position:absolute;inset:0}
.feature .f-title{position:relative;font-size:20px;font-weight:700}
.feature .f-sub{position:relative;font-size:13px;color:var(--muted);margin-top:6px}

/* ---- profile ---- */
.greet{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:2px}
.greet h1{font-size:26px}
.greet .g-sub{font-size:15px;color:rgba(35,20,9,.72);margin-top:2px}
.avatar{flex:none;width:56px;height:56px;border-radius:18px;overflow:hidden;display:grid;place-items:center;background:#2a2a2e;color:#fff}
.quick{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:16px}
.qbtn{
  background:#1c1c1e;border-radius:18px;padding:14px 6px;text-align:center;color:#fff;
  transition:transform .16s var(--ease);contain:paint;
}
.qbtn:active{transform:scale(.95)}
.qbtn svg{width:22px;height:22px}
.qbtn .ql{font-size:13px;font-weight:600;margin-top:9px}

.prow{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);transition:transform .16s var(--ease);contain:layout paint}
.prow:active{transform:scale(.985)}
.prow .picon{flex:none;width:26px;height:26px;color:var(--muted)}
.prow .pl{flex:1;font-size:16px;font-weight:500}
.prow .dot{width:6px;height:6px;border-radius:50%;background:var(--orange);margin-left:6px;display:inline-block;vertical-align:middle}
.prow .chev{flex:none;width:38px;height:38px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.version{text-align:center;color:var(--muted-2);font-size:12px;margin:34px 0 10px}

/* ---- bottom nav ---- */
.nav{
  position:absolute;left:0;right:0;bottom:0;
  height:calc(72px + var(--sab));
  padding-bottom:var(--sab);
  background:linear-gradient(180deg,rgba(18,18,18,.82),rgba(18,18,18,.98));
  display:flex;align-items:center;justify-content:space-around;
  border-top:1px solid var(--line);
  z-index:20;
}
.nav-item{
  position:relative;width:56px;height:56px;display:grid;place-items:center;
  color:var(--muted-2);transition:color .25s var(--ease);
}
.nav-item.active{color:#fff}
.nav-item svg{width:25px;height:25px;position:relative;z-index:2;transition:transform .25s var(--ease)}
.nav-item.active svg{transform:translateY(-1px)}
.nav-pill{
  position:absolute;top:50%;left:50%;width:52px;height:44px;margin:-22px 0 0 -26px;
  background:rgba(255,255,255,.10);border-radius:16px;z-index:1;
  transform:translateX(0);opacity:0;
  transition:transform .34s var(--ease),opacity .25s var(--ease);
}

/* ---- mini player ---- */
.mini{
  position:absolute;left:12px;right:12px;bottom:calc(80px + var(--sab));
  background:#232326;border:1px solid var(--line);border-radius:20px;
  display:flex;align-items:center;gap:12px;padding:9px 12px;
  transform:translateY(24px) scale(.96);opacity:0;pointer-events:none;
  transition:transform .34s var(--ease),opacity .28s var(--ease);
  z-index:19;
}
.mini.show{transform:none;opacity:1;pointer-events:auto}
.mini .mthumb{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center}
.mini .mthumb svg{width:18px;height:18px;opacity:.9}
.mini .mmeta{flex:1;min-width:0}
.mini .mt{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .ms{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .mplay{width:40px;height:40px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;flex:none}
.mini .mplay svg{width:18px;height:18px}
.mini .mbar{position:absolute;left:12px;right:12px;bottom:5px;height:2px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden}
.mini .mbar i{display:block;height:100%;width:100%;background:var(--orange);transform-origin:left;transform:scaleX(0)}

/* ---- now playing sheet ---- */
.sheet{
  position:absolute;inset:0;z-index:40;
  background:var(--ink);
  transform:translateY(101%);
  transition:transform .42s var(--ease);
  display:flex;flex-direction:column;
  will-change:transform;
}
.sheet.open{transform:none}
.sheet-back{position:absolute;inset:0;z-index:39;background:#000;opacity:0;pointer-events:none;transition:opacity .42s var(--ease)}
.sheet-back.open{opacity:.4;pointer-events:auto}
.sheet .glowbg{position:absolute;inset:0;opacity:.5;filter:saturate(1.1)}
.sheet-inner{position:relative;flex:1;display:flex;flex-direction:column;padding:calc(14px + var(--sat)) 26px calc(26px + var(--sab));z-index:2}
.sheet-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted)}
.sheet-top .src{font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.sheet-top button{width:40px;height:40px;display:grid;place-items:center;color:#fff}
.np-art{
  flex:1;margin:22px 0;border-radius:28px;display:grid;place-items:center;overflow:hidden;
  box-shadow:0 24px 60px rgba(0,0,0,.5);min-height:0;
}
.np-art svg{width:34%;height:34%;opacity:.9;color:rgba(255,255,255,.9)}
.np-meta .np-title{font-size:24px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-meta .np-artist{font-size:15px;color:var(--muted);margin-top:5px}
.np-prog{margin-top:22px}
.np-bar{height:6px;border-radius:6px;background:rgba(255,255,255,.14);position:relative;overflow:hidden}
.np-bar .fill{position:absolute;inset:0;background:#fff;transform-origin:left;transform:scaleX(0);border-radius:6px}
.np-times{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:9px}
.np-ctrl{display:flex;align-items:center;justify-content:space-between;margin-top:20px}
.np-ctrl .side{color:var(--muted);width:44px;height:44px;display:grid;place-items:center}
.np-ctrl .side.on{color:var(--orange-soft)}
.np-ctrl .mid{display:flex;align-items:center;gap:26px}
.np-ctrl .skip{width:52px;height:52px;display:grid;place-items:center;color:#fff;transition:transform .16s var(--ease)}
.np-ctrl .skip:active{transform:scale(.9)}
.np-ctrl .play{
  width:72px;height:72px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;
  transition:transform .16s var(--ease);
}
.np-ctrl .play:active{transform:scale(.93)}
.np-ctrl .play svg{width:30px;height:30px}

/* ---- empty / permission ---- */
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.empty .ebig{width:64px;height:64px;margin:0 auto 18px;border-radius:20px;background:var(--surface);display:grid;place-items:center;color:var(--orange)}
.empty h3{color:#fff;margin:0 0 8px;font-size:18px}
.empty p{margin:0 0 20px;font-size:14px;line-height:1.5}
.empty .btn{background:#fff;color:#111;font-weight:700;border-radius:26px;padding:14px 26px}

/* ---- entrance stagger ---- */
.enter{opacity:0;transform:translateY(12px)}
.enter.in{opacity:1;transform:none;transition:opacity .4s var(--ease),transform .5s var(--ease)}

@media (prefers-reduced-motion:reduce){
  *{transition-duration:.001s !important;animation:none !important}
}
</style>
</head>
<body>
<div class="app" id="app">

  <div class="screens" id="screens">

    <!-- ================= HOME ================= -->
    <section class="screen active" data-screen="home">
      <div class="hero">
        <div class="statusbar">
          <span class="sb-clock" id="clock">9:41</span>
          <span class="sb-right">
            <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="8" width="3" height="4" rx="1" fill="#231409"/><rect x="5" y="5" width="3" height="7" rx="1" fill="#231409"/><rect x="10" y="2.5" width="3" height="9.5" rx="1" fill="#231409"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#231409"/></svg>
            <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><path d="M8.5 2.2c2.2 0 4.2.8 5.7 2.2l1.3-1.4C13.7 1.2 11.2.2 8.5.2S3.3 1.2 1.5 3l1.3 1.4C4.3 3 6.3 2.2 8.5 2.2Zm0 3.5c1.3 0 2.5.5 3.4 1.4l1.3-1.4C11.9 4.4 10.3 3.7 8.5 3.7S5.1 4.4 3.8 5.7l1.3 1.4c.9-.9 2.1-1.4 3.4-1.4Zm0 3.4c.6 0 1.1.2 1.5.6l-1.5 1.6-1.5-1.6c.4-.4.9-.6 1.5-.6Z" fill="#231409"/></svg>
            <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="21" height="11" rx="3.2" stroke="#231409" opacity=".5"/><rect x="2" y="2" width="16" height="8" rx="1.8" fill="#231409"/><rect x="23" y="4" width="2" height="4" rx="1" fill="#231409" opacity=".5"/></svg>
          </span>
        </div>
        <div class="tiles" id="tiles"></div>
      </div>
      <div class="body">
        <div class="searchbar">
          <span class="mag"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.2-3.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
          <input id="search" type="text" placeholder="Search songs, artists…" autocomplete="off" spellcheck="false">
          <button class="chip-white" id="shuffleBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Shuffle
          </button>
        </div>
        <div class="list" id="recentList"></div>
      </div>
    </section>

    <!-- ================= LIBRARY ================= -->
    <section class="screen" data-screen="library">
      <div class="hero hero-lib">
        <div class="statusbar">
          <span class="sb-clock">9:41</span>
          <span class="sb-right">
            <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="8" width="3" height="4" rx="1" fill="#231409"/><rect x="5" y="5" width="3" height="7" rx="1" fill="#231409"/><rect x="10" y="2.5" width="3" height="9.5" rx="1" fill="#231409"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#231409"/></svg>
            <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><path d="M8.5 2.2c2.2 0 4.2.8 5.7 2.2l1.3-1.4C13.7 1.2 11.2.2 8.5.2S3.3 1.2 1.5 3l1.3 1.4C4.3 3 6.3 2.2 8.5 2.2Zm0 3.5c1.3 0 2.5.5 3.4 1.4l1.3-1.4C11.9 4.4 10.3 3.7 8.5 3.7S5.1 4.4 3.8 5.7l1.3 1.4c.9-.9 2.1-1.4 3.4-1.4Zm0 3.4c.6 0 1.1.2 1.5.6l-1.5 1.6-1.5-1.6c.4-.4.9-.6 1.5-.6Z" fill="#231409"/></svg>
            <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="21" height="11" rx="3.2" stroke="#231409" opacity=".5"/><rect x="2" y="2" width="16" height="8" rx="1.8" fill="#231409"/><rect x="23" y="4" width="2" height="4" rx="1" fill="#231409" opacity=".5"/></svg>
          </span>
        </div>
        <h1 style="display:flex;align-items:center;gap:10px">Library
          <span style="width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center;color:#231409">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </span>
        </h1>
        <div class="sect">Recently played</div>
        <div class="feature" id="feature">
          <div class="glow" id="featureGlow"></div>
          <div class="f-title" id="featureTitle">Your library</div>
          <div class="f-sub" id="featureSub">Tap a song to start listening</div>
        </div>
      </div>
      <div class="body">
        <div class="list" id="libraryList" style="margin-top:14px"></div>
      </div>
    </section>

    <!-- ================= PROFILE ================= -->
    <section class="screen" data-screen="profile">
      <div class="hero">
        <div class="statusbar">
          <span class="sb-clock">9:41</span>
          <span class="sb-right">
            <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="8" width="3" height="4" rx="1" fill="#231409"/><rect x="5" y="5" width="3" height="7" rx="1" fill="#231409"/><rect x="10" y="2.5" width="3" height="9.5" rx="1" fill="#231409"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#231409"/></svg>
            <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><path d="M8.5 2.2c2.2 0 4.2.8 5.7 2.2l1.3-1.4C13.7 1.2 11.2.2 8.5.2S3.3 1.2 1.5 3l1.3 1.4C4.3 3 6.3 2.2 8.5 2.2Zm0 3.5c1.3 0 2.5.5 3.4 1.4l1.3-1.4C11.9 4.4 10.3 3.7 8.5 3.7S5.1 4.4 3.8 5.7l1.3 1.4c.9-.9 2.1-1.4 3.4-1.4Zm0 3.4c.6 0 1.1.2 1.5.6l-1.5 1.6-1.5-1.6c.4-.4.9-.6 1.5-.6Z" fill="#231409"/></svg>

</div>

<script>
(function () {
  "use strict";
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var B = window.SonoraBridge || null;
  var android = !!B;

  var PLAY_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>';
  var PAUSE_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="5" width="3.6" height="14" rx="1.2"/><rect x="13.4" y="5" width="3.6" height="14" rx="1.2"/></svg>';
  var NOTE_SVG = '<svg viewBox="0 0 24 24" fill="none"><path d="M9 18V6l10-2v12" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><ellipse cx="6.5" cy="18" rx="2.5" ry="2" fill="currentColor"/><ellipse cx="16.5" cy="16" rx="2.5" ry="2" fill="currentColor"/></svg>';

  var CHEV = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="m9 6 6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var HEART_ON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="color:#F3A264"><path d="M12 20s-7-4.5-7-9.5A4 4 0 0 1 12 7a4 4 0 0 1 7 3.5C19 15.5 12 20 12 20Z"/></svg>';
  var HEART_OFF_BIG = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 20s-7-4.5-7-9.5A4 4 0 0 1 12 7a4 4 0 0 1 7 3.5C19 15.5 12 20 12 20Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>';
  var HEART_ON_BIG = '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 20s-7-4.5-7-9.5A4 4 0 0 1 12 7a4 4 0 0 1 7 3.5C19 15.5 12 20 12 20Z"/></svg>';

  /* ---------- demo library (browser only) ---------- */
  var DEMO = [
    { title: "Neon Harbour", artist: "Aria Vale", album: "Afterglow", duration: 214000, hue: 268 },
    { title: "Slow Tide", artist: "Milo Reyes", album: "Coastlines", duration: 187000, hue: 200 },
    { title: "Amber Room", artist: "Kaya Bloom", album: "Warm Static", duration: 232000, hue: 32 },
    { title: "Paper Lanterns", artist: "The Halcyon", album: "Nightfall", duration: 245000, hue: 12 },
    { title: "Glass Avenue", artist: "Sena Okada", album: "Mirrors", duration: 198000, hue: 320 },
    { title: "Low Orbit", artist: "Fielding", album: "Signals", duration: 263000, hue: 168 },
    { title: "Velvet Hours", artist: "Rue Marlow", album: "Late", duration: 176000, hue: 288 },
    { title: "Golden Static", artist: "Kaya Bloom", album: "Warm Static", duration: 221000, hue: 44 }
  ].map(function (s, i) {
    s.id = i; s.art = null; return s;
  });

  var library = android ? [] : DEMO.slice();
  var view = library;                 // currently displayed/filterable list
  var cur = -1, playing = false, pos = 0, dur = 0;
  var repeat = 0, shuffle = false;
  var simTimer = null;
  var filterMode = "all";
  var likes = {};
  try { likes = JSON.parse(localStorage.getItem("sonora.likes") || "{}"); } catch (e) { likes = {}; }
  function likeKey(s) { return (s.title || "") + "|" + (s.artist || ""); }
  function isLiked(s) { return !!likes[likeKey(s)]; }
  function toggleLike(s) {
    var k = likeKey(s);
    if (likes[k]) { delete likes[k]; } else { likes[k] = 1; }
    try { localStorage.setItem("sonora.likes", JSON.stringify(likes)); } catch (e) {}
    updateHeart(); refresh();
  }

  /* ---------- helpers ---------- */
  function fmt(ms) {
    if (!ms || ms < 0) ms = 0;
    var s = Math.floor(ms / 1000), m = Math.floor(s / 60);
    s = s % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }
  function grad(hue) {
    var h1 = hue, h2 = (hue + 48) % 360;
    return "linear-gradient(135deg,hsl(" + h1 + ",62%,26%),hsl(" + h2 + ",58%,13%))";
  }
  function artOf(song) {
    if (!song) return "linear-gradient(135deg,#2a2a2e,#1a1a1c)";
    if (song.art) return "url('" + song.art + "') center/cover, " + grad(hashHue(song.title));
    return grad(song.hue != null ? song.hue : hashHue(song.title));
  }
  function hashHue(str) {
    var h = 0;
    for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 360;
    return h;
  }
  function buzz(ms) { if (B && B.vibrate) { try { B.vibrate(ms || 8); } catch (e) {} } }

  /* ---------- tiles ---------- */
  var TILES = [
    { label: "Favorites", filter: "favorites", badge: "New", hue: 28, glyph: '<path d="M12 20s-7-4.5-7-9.5A4 4 0 0 1 12 7a4 4 0 0 1 7 3.5C19 15.5 12 20 12 20Z" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>' },
    { label: "Albums", filter: "albums", hue: 205, glyph: '<circle cx="12" cy="12" r="9" stroke="#fff" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="#fff"/>' },
    { label: "Artists", filter: "artists", hue: 160, glyph: '<circle cx="12" cy="8" r="4" stroke="#fff" stroke-width="2"/><path d="M5 20c0-3.6 3.2-6 7-6s7 2.4 7 6" stroke="#fff" stroke-width="2" stroke-linecap="round"/>' },
    { label: "Songs", filter: "all", hue: 268, glyph: '<path d="M9 18V6l10-2v12" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><ellipse cx="6.5" cy="18" rx="2.5" ry="2" fill="#fff"/><ellipse cx="16.5" cy="16" rx="2.5" ry="2" fill="#fff"/>' }
  ];
  (function renderTiles() {
    var host = $("#tiles");
    TILES.forEach(function (t, i) {
      var el = document.createElement("button");
      el.className = "tile enter";
      el.innerHTML =
        '<div class="glow" style="background:' + grad(t.hue) + '"></div>' +
        '<svg class="glyph" viewBox="0 0 24 24" fill="none">' + t.glyph + "</svg>" +
        '<div class="tl-row"><span class="tl-label">' + t.label + "</span>" +
        (t.badge ? '<span class="badge">' + t.badge + "</span>" : "") + "</div>";
      el.addEventListener("click", function () { buzz(); setFilter(t.filter); go("library"); });
      host.appendChild(el);
      setTimeout(function () { el.classList.add("in"); }, 60 + i * 55);
    });
  })();

  /* ---------- list rendering ---------- */
  function rowEl(song, kind) {
    var el = document.createElement("div");
    el.className = (kind === "lib" ? "lrow" : "row") + " enter";
    if (kind === "lib") {
      el.innerHTML =
        '<div class="thumb" style="background:' + artOf(song) + '">' + NOTE_SVG + "</div>" +
        '<div class="meta"><div class="t">' + esc(song.title) + '</div>' +
        '<div class="s">' + esc(song.artist) + " \u00B7 " + fmt(song.duration) + "</div></div>" +
        '<div class="chev">' + (isLiked(song) ? HEART_ON : CHEV) + "</div>";
    } else {
      el.innerHTML =
        '<div class="thumb" style="background:' + artOf(song) + '">' + NOTE_SVG + "</div>" +
        '<div class="meta"><div class="t">' + esc(song.title) + '</div>' +
        '<div class="s">' + esc(song.artist) + " \u00B7 " + esc(song.album || "Unknown") + "</div></div>" +
        '<div class="act">' + PLAY_SVG + "</div>";
    }
    el.addEventListener("click", function () { buzz(); playSong(song); openSheet(); });
    el.addEventListener("contextmenu", function (e) {
      e.preventDefault(); buzz(14); toggleLike(song);
      if (B) B.toastMsg(isLiked(song) ? "Added to Favorites" : "Removed from Favorites");
    });
    return el;
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function renderList(host, kind, data) {
    host.innerHTML = "";
    if (!data.length) { host.innerHTML = emptyState(); wireGrant(); return; }
    data.forEach(function (s, i) {
      var el = rowEl(s, kind);
      host.appendChild(el);
      if (i < 12) { setTimeout(function () { el.classList.add("in"); }, 40 + i * 35); }
      else { el.classList.add("in"); }
    });
  }
  function emptyState() {
    if (filterMode === "favorites") {
      return '<div class="empty"><div class="ebig">' + HEART_OFF_BIG + "</div>" +
        "<h3>No favorites yet</h3><p>Long-press any song to add it to your favorites.</p></div>";
    }
    return '<div class="empty"><div class="ebig">' + NOTE_SVG + "</div>" +
      "<h3>No songs yet</h3><p>" + (android
        ? "Allow access to your music and Sonora will list everything on your device."
        : "Add audio to your device and it will appear here.") +
      "</p>" + (android ? '<button class="btn" id="grantBtn">Allow access</button>' : "") + "</div>";
  }
  function wireGrant() {
    var gb = $("#grantBtn");
    if (gb) gb.addEventListener("click", function () { if (B) B.requestAudio(); });
  }
  function playSong(song) {
    var i = view.indexOf(song);
    if (i < 0) { view = view.concat([song]); i = view.length - 1; }
    playIndex(i);
  }
  function currentData() {
    var q = ($("#search").value || "").trim().toLowerCase();
    var base = (filterMode === "favorites") ? library.filter(isLiked) : library;
    if (q) {
      base = base.filter(function (s) {
        return (s.title + " " + s.artist + " " + (s.album || "")).toLowerCase().indexOf(q) >= 0;
      });
    }
    return base;
  }
  function setFilter(mode) { filterMode = mode; refresh(); }
  function renderLibrary(data) {
    var host = $("#libraryList");
    host.innerHTML = "";
    if (!data.length) { host.innerHTML = emptyState(); wireGrant(); return; }
    if (filterMode === "albums" || filterMode === "artists") {
      var key = filterMode === "albums" ? "album" : "artist";
      var order = [], groups = {};
      data.forEach(function (s) {
        var k = s[key] || "Unknown";
        if (!groups[k]) { groups[k] = []; order.push(k); }
        groups[k].push(s);
      });
      order.forEach(function (k) {
        var h = document.createElement("div");
        h.className = "grouphead";
        h.textContent = k + "  \u00B7  " + groups[k].length + " songs";
        host.appendChild(h);
        groups[k].forEach(function (s) { host.appendChild(rowEl(s, "lib")); });
      });
    } else {
      data.forEach(function (s) { host.appendChild(rowEl(s, "lib")); });
    }
    var rows = host.querySelectorAll(".lrow");
    Array.prototype.forEach.call(rows, function (el, i) {
      if (i < 14) { setTimeout(function () { el.classList.add("in"); }, 30 + i * 28); }
      else { el.classList.add("in"); }
    });
  }
  function refresh() {
    var data = currentData();
    view = data;
    renderList($("#recentList"), "recent", data.slice(0, 6));
    renderLibrary(data);
    wireGrant();
    if (filterMode === "all") {
      if (library.length) {
        $("#featureTitle").textContent = library[0].album || library[0].title;
        $("#featureSub").textContent = library.length + " songs \u00B7 " + library[0].artist;
        $("#featureGlow").style.background = artOf(library[0]);
      } else {
        $("#featureTitle").textContent = "Your library";
        $("#featureSub").textContent = "Tap a song to start listening";
      }
    } else {
      var label = filterMode === "albums" ? "Albums" : filterMode === "artists" ? "Artists" : "Favorites";
      $("#featureTitle").textContent = label;
      $("#featureSub").textContent = data.length + " song" + (data.length === 1 ? "" : "s");
      $("#featureGlow").style.background = "linear-gradient(135deg,#2a1f3d,#1c1c1e)";
    }
    if (library.length) $("#profileName").textContent = library.length + " songs on this device";
  }

  /* ---------- navigation ---------- */
  function go(name) {
    $$(".screen").forEach(function (s) {
      s.classList.toggle("active", s.dataset.screen === name);
    });
    $$(".nav-item").forEach(function (n) {
      n.classList.toggle("active", n.dataset.nav === name);
    });
    movePill();
  }
  function movePill() {
    var active = $(".nav-item.active");
    if (!active) return;
    var pill = $("#navPill");
    var r = active.getBoundingClientRect();
    var pr = active.parentElement.getBoundingClientRect();
    pill.style.opacity = "1";
    pill.style.transform = "translateX(" + (r.left - pr.left - (pr.width / 2 - r.width / 2)) + "px)";
  }
  $$(".nav-item").forEach(function (n) {
    n.addEventListener("click", function () { buzz(); go(n.dataset.nav); });
  });

  /* ---------- settings rows ---------- */
  var SETTINGS = [
    { label: "Equalizer", dot: true, icon: '<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="6" r="2" fill="currentColor"/><circle cx="10" cy="12" r="2" fill="currentColor"/><circle cx="18" cy="18" r="2" fill="currentColor"/>' },
    { label: "Sleep timer", icon: '<circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2"/><path d="M12 8v4l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>' },
    { label: "Appearance", icon: '<circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2"/><path d="M12 4a8 8 0 0 0 0 16Z" fill="currentColor"/>' },
    { label: "About Sonora", icon: '<circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2"/><path d="M12 11v5M12 8h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>' }
  ];
  (function renderSettings() {
    var host = $("#settings");
    SETTINGS.forEach(function (s) {
      var el = document.createElement("div");
      el.className = "prow enter";
      el.innerHTML = '<div class="picon"><svg viewBox="0 0 24 24" fill="none">' + s.icon + "</svg></div>" +
        '<div class="pl">' + s.label + (s.dot ? '<span class="dot"></span>' : "") + "</div>" +
        '<div class="chev"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="m9 6 6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>';
      el.addEventListener("click", function () { buzz(); if (B) B.toastMsg(s.label + " \u2014 coming soon"); });
      host.appendChild(el);
      setTimeout(function () { el.classList.add("in"); }, 60);
    });
  })();

  /* ---------- player ---------- */
  function playIndex(i) {
    if (i < 0 || i >= view.length) return;
    cur = i;
    var song = view[i];
    if (B) {
      B.setQueue(JSON.stringify(view), i);
    } else {
      pos = 0; dur = song.duration; playing = true;
      startSim();
    }
    syncNow(song);
  }
  function syncNow(song) {
    $("#npTitle").textContent = song ? song.title : "—";
    $("#npArtist").textContent = song ? song.artist : "—";
    $("#npArt").style.background = artOf(song);
    $("#sheetGlow").style.background = artOf(song);
    $("#miniTitle").textContent = song ? song.title : "—";
    $("#miniArtist").textContent = song ? song.artist : "—";
    $("#miniThumb").style.background = artOf(song);
    $("#mini").classList.add("show");
    updateHeart();
  }
  function updateHeart() {
    var el = $("#npLike");
    if (!el) return;
    var s = (cur >= 0 && view[cur]) ? view[cur] : null;
    var on = s ? isLiked(s) : false;
    el.innerHTML = on ? HEART_ON_BIG : HEART_OFF_BIG;
    el.classList.toggle("on", on);
  }
  function setPlaying(p) {
    playing = p;
    $("#btnPlay").innerHTML = p ? PAUSE_SVG : PLAY_SVG;
    $("#miniPlay").innerHTML = p ? PAUSE_SVG : PLAY_SVG;
  }
  function updateProgress() {
    var f = dur > 0 ? Math.min(1, pos / dur) : 0;
    $("#npFill").style.transform = "scaleX(" + f + ")";
    $("#miniBar").style.transform = "scaleX(" + f + ")";
    $("#npCur").textContent = fmt(pos);
    $("#npDur").textContent = fmt(dur);
  }
  function startSim() {
    stopSim();
    simTimer = setInterval(function () {
      if (!playing) return;
      pos += 250;
      if (pos >= dur) {
        pos = dur;
        updateProgress();
        next(true);
        return;
      }
      updateProgress();
    }, 250);
  }
  function stopSim() { if (simTimer) { clearInterval(simTimer); simTimer = null; } }

  function toggle() {
    if (cur < 0 && view.length) { playIndex(0); return; }
    if (B) { B.toggle(); return; }
    setPlaying(!playing);
    if (playing) startSim();
  }
  function next(auto) {
    if (!view.length) return;
    if (repeat === 2) { playIndex(cur); return; }
    var n;
    if (shuffle && view.length > 1) { do { n = Math.floor(Math.random() * view.length); } while (n === cur); }
    else {
      n = cur + 1;
      if (n >= view.length) { if (repeat === 1 || auto && false) { n = 0; } else { setPlaying(false); return; } }
    }
    playIndex(n);
  }
  function prev() {
    if (!view.length) return;
    if (B) { B.prev(); return; }
    if (pos > 4000) { pos = 0; updateProgress(); return; }
    playIndex((cur - 1 + view.length) % view.length);
  }

  /* ---------- sheet ---------- */
  function openSheet() { $("#sheet").classList.add("open"); $("#sheetBack").classList.add("open"); }
  function closeSheet() { $("#sheet").classList.remove("open"); $("#sheetBack").classList.remove("open"); }

  /* ---------- wire controls ---------- */
  $("#btnPlay").addEventListener("click", function () { buzz(); toggle(); });
  $("#miniPlay").addEventListener("click", function (e) { e.stopPropagation(); buzz(); toggle(); });
  $("#mini").addEventListener("click", openSheet);
  $("#btnNext").addEventListener("click", function () { buzz(); next(false); });
  $("#btnPrev").addEventListener("click", function () { buzz(); prev(); });
  $("#sheetClose").addEventListener("click", closeSheet);
  $("#sheetBack").addEventListener("click", closeSheet);
  $("#sheetMore").addEventListener("click", function () { if (B) B.toastMsg("Options \u2014 coming soon"); });
  $("#btnShuffle").addEventListener("click", function () {
    shuffle = !shuffle; this.classList.toggle("on", shuffle);
    if (B) B.setShuffle(shuffle);
  });
  $("#btnRepeat").addEventListener("click", function () {
    repeat = (repeat + 1) % 3; this.classList.toggle("on", repeat > 0);
    this.dataset.mode = repeat;
    if (B) B.setRepeat(repeat);
    if (B) B.toastMsg(repeat === 0 ? "Repeat off" : repeat === 1 ? "Repeat all" : "Repeat one");
  });
  $("#shuffleBtn").addEventListener("click", function () {
    buzz();
    if (!library.length) return;
    shuffle = true; $("#btnShuffle").classList.add("on");
    if (B) B.setShuffle(true);
    playIndex(Math.floor(Math.random() * view.length));
    openSheet();
  });
  $("#search").addEventListener("input", refresh);
  var npLikeBtn = $("#npLike");
  if (npLikeBtn) npLikeBtn.addEventListener("click", function () { buzz(); if (cur >= 0 && view[cur]) toggleLike(view[cur]); });
  $$(".qbtn").forEach(function (b) {
    b.addEventListener("click", function () {
      buzz();
      var t = b.dataset.quick;
      if (t === "Favorites") { setFilter("favorites"); go("library"); }
      else if (B) B.toastMsg(t + " - coming soon");
    });
  });

  /* progress drag */
  (function () {
    var bar = $("#npBar"), dragging = false;
    function seekTo(clientX) {
      var r = bar.getBoundingClientRect();
      var f = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
      pos = f * dur;
      updateProgress();
    }
    bar.addEventListener("pointerdown", function (e) { dragging = true; bar.setPointerCapture(e.pointerId); seekTo(e.clientX); });
    bar.addEventListener("pointermove", function (e) { if (dragging) seekTo(e.clientX); });
    bar.addEventListener("pointerup", function (e) {
      dragging = false;
      if (B) B.seek(Math.round(pos));
    });
  })();

  /* ---------- native callbacks ---------- */
  window.__songs = function (json) {
    try {
      var arr = JSON.parse(json);
      library = arr.map(function (s) {
        return { title: s.title, artist: s.artist, album: s.album, duration: s.duration, uri: s.uri, art: s.art, hue: hashHue(s.title) };
      });
      refresh();
    } catch (e) {}
  };
  window.__perm = function (granted) { if (granted) refresh(); };
  window.__player = function (st) {
    dur = st.duration || 0;
    pos = st.position || 0;
    if (st.song) {
      cur = st.index;
      syncNow(st.song);
    }
    setPlaying(st.state === "playing");
    shuffle = !!st.shuffle; repeat = st.repeat || 0;
    $("#btnShuffle").classList.toggle("on", shuffle);
    $("#btnRepeat").classList.toggle("on", repeat > 0);
    updateProgress();
    if (st.state === "stopped" && !st.song) $("#mini").classList.remove("show");
  };

  /* ---------- boot ---------- */
  function tickClock() {
    var d = new Date(), h = d.getHours() % 12; if (h === 0) h = 12;
    var m = d.getMinutes(); var t = h + ":" + (m < 10 ? "0" : "") + m;
    $$(".sb-clock").forEach(function (c) { c.textContent = t; });
  }
  tickClock(); setInterval(tickClock, 20000);
  function applyHash() {
    var h = (location.hash || "").replace("#", "");
    if (h === "home" || h === "library" || h === "profile") go(h);
    if (h === "albums" || h === "artists" || h === "favorites") { filterMode = h; refresh(); go("library"); }
    if (h === "player") { if (view.length) playIndex(0); openSheet(); }
  }
  setPlaying(false);
  refresh();
  movePill();
  applyHash();
  window.addEventListener("hashchange", applyHash);
  window.addEventListener("resize", movePill);
  if (B && B.setBars) { try { B.setBars("#121212", false); } catch (e) {} }
  if (B) {
    if (B.hasAudio && B.hasAudio()) { B.scan(); }
    else { refresh(); }
    if (B.requestState) { try { B.requestState(); } catch (e) {} }
  }
})();
</script>
</body>
</html>
